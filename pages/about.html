<body class="min-h-screen font-sans antialiased bg-background text-foreground overflow-x-hidden">
    <main>
      <!-- ===== Header ===== -->
      <header class="px-6 md:px-10 pt-14 pb-10">
        <div class="max-w-3xl mx-auto">
          <div class="flex items-center gap-2.5 mb-8">
            <span class="w-8 h-8 rounded-md bg-primary flex items-center justify-center text-primary-foreground text-sm font-bold">JY</span>
            <span class="font-semibold text-foreground tracking-tight">Jackson Yang</span>
          </div>
          <p class="text-primary font-mono text-xs tracking-widest uppercase mb-4">A timeline of my life in Aotearoa</p>
          <h1 class="text-4xl md:text-5xl font-bold tracking-tight leading-tight mb-4">Five cities, one country, a few years of real life.</h1>
          <p class="text-muted-foreground max-w-xl leading-relaxed">
            Not a travel diary. These are the places I actually lived, worked and settled into — in order.
          </p>
        </div>
      </header>

      <!-- ===== Timeline ===== -->
      <section class="px-6 md:px-10 pb-24">
        <div class="max-w-3xl mx-auto">
          <div id="timeline" class="relative">
            <!-- vertical line -->
            <div class="absolute left-[7px] top-2 bottom-2 w-px bg-border"></div>
            <p id="timeline-status" class="text-sm text-muted-foreground pl-10">Loading…</p>
          </div>
        </div>
      </section>

      <footer class="px-6 md:px-10 py-10 border-t border-border">
        <div class="max-w-3xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-sm text-muted-foreground">
          <p>© 2026 Jackson Yang</p>
          <a href="admin.html" class="font-mono text-xs hover:text-primary transition-colors duration-200">manage &rarr;</a>
        </div>
      </footer>
    </main>

    <script>
      /* ============================================================
         Giscus configuration — fill these in to turn on comments.
         Get all four values at https://giscus.app by installing the
         giscus app on a public GitHub repo with Discussions enabled.
         ============================================================ */
      const GISCUS = {
        repo: "Jackson-JY/personal-site",
        repoId: "R_kgDOVvO7jQ",
        category: "General",
        categoryId: "DIC_kwDOVvO7jc4DLMFX"
      };

      // Works both in local preview (pages/about.html) and deployed root (index.html)
      const DATA_URL = new URL(
        (location.pathname.indexOf("/pages/") !== -1 ? "../" : "") + "data/timeline.json",
        location.href
      ).href;

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function resolveImage(path) {
        if (!path) return "";
        if (/^(https?:|data:)/.test(path)) return path;
        return new URL(path, DATA_URL).href;
      }

      function entryMarkup(entry, index, commentsEnabled) {
        const image = resolveImage(entry.image);
        const term = "timeline-" + (entry.id || index);
        const comments = commentsEnabled
          ? `<button type="button" class="comment-toggle inline-flex items-center gap-2 text-sm font-mono text-muted-foreground hover:text-primary transition-colors duration-200" data-term="${esc(term)}">
               <i data-lucide="message-circle" class="w-4 h-4"></i>
               <span>Comments</span>
             </button>
             <div class="comment-host hidden mt-4"></div>`
          : `<p class="text-xs text-muted-foreground font-mono">Comments are not configured yet.</p>`;

        return `
          <article class="relative pl-10 pb-14 group">
            <span class="absolute left-0 top-2 w-[15px] h-[15px] rounded-full bg-background border-2 border-primary"></span>
            <div class="flex items-center gap-3 mb-3">
              <span class="text-primary font-mono text-sm">${esc(entry.date)}</span>
            </div>
            <h2 class="text-2xl font-bold mb-4">${esc(entry.title)}</h2>
            ${image ? `<div class="image-slot overflow-hidden rounded-lg mb-4 bg-card" data-image="${esc(entry.image)}" data-alt="${esc(entry.title)}"></div>` : ""}
            <p class="text-muted-foreground leading-relaxed mb-4">${esc(entry.description)}</p>
            ${comments}
          </article>`;
      }

      function mountGiscus(host, term) {
        const script = document.createElement("script");
        script.src = "https://giscus.app/client.js";
        script.async = true;
        script.setAttribute("crossorigin", "anonymous");
        script.dataset.repo = GISCUS.repo;
        script.dataset.repoId = GISCUS.repoId;
        script.dataset.category = GISCUS.category;
        script.dataset.categoryId = GISCUS.categoryId;
        script.dataset.mapping = "specific";
        script.dataset.term = term;
        script.dataset.strict = "1";
        script.dataset.reactionsEnabled = "1";
        script.dataset.emitMetadata = "0";
        script.dataset.inputPosition = "top";
        script.dataset.theme = "transparent_dark";
        script.dataset.lang = "en";
        host.appendChild(script);
      }

      async function initTimeline() {
        const container = document.getElementById("timeline");
        const status = document.getElementById("timeline-status");
        const commentsEnabled = Boolean(GISCUS.repo && GISCUS.repoId && GISCUS.categoryId);

        let entries = [];
        try {
          const response = await fetch(DATA_URL, { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          entries = Array.isArray(data.entries) ? data.entries : [];
        } catch (error) {
          status.textContent = "Could not load timeline data.";
          return;
        }

        if (!entries.length) {
          status.textContent = "No timeline entries yet.";
          return;
        }

        status.remove();
        container.insertAdjacentHTML(
          "afterbegin",
          entries.map((entry, index) => entryMarkup(entry, index, commentsEnabled)).join("")
        );

        container.querySelectorAll(".image-slot").forEach((slot) => {
          const source = resolveImage(slot.dataset.image);
          if (!source) return;
          const img = document.createElement("img");
          img.src = source;
          img.alt = slot.dataset.alt || "";
          img.loading = "lazy";
          img.className =
            "w-full max-h-[520px] object-cover transition-transform duration-700 ease-out group-hover:scale-[1.02]";
          slot.appendChild(img);
        });

        container.querySelectorAll(".comment-toggle").forEach((button) => {
          button.addEventListener("click", () => {
            const host = button.nextElementSibling;
            if (host.dataset.mounted === "1") {
              host.classList.toggle("hidden");
              return;
            }
            host.dataset.mounted = "1";
            host.classList.remove("hidden");
            mountGiscus(host, button.dataset.term);
            button.querySelector("span").textContent = "Hide comments";
          });
        });

        if (window.lucide) window.lucide.createIcons();
      }

      initTimeline();
    </script>
  </body>
